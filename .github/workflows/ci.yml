name: CPMSL Frontend CI

# Contrôles de base du frontend : dépendances, types, tests vitest.
# Les tests vitest sont ceux de lib/**/__tests__/ (vitest.config.mts) ; ils
# ne parlent à aucun serveur ni à aucune base. Aucun audit d'interface ne
# tourne en CI : les workflows ui-audit.yml et ux-audit.yml, qui n'ont jamais
# abouti, ont été retirés (2026-11-06) ; un contrôle déterministe est prévu.

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: cpmsl-frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Même version majeure que le poste de développement (node -v : v24).
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ADR-007 § 2 : les validateurs du contrat (lib/api/menfp/contract.gen.ts)
      # sont générés depuis la copie épinglée contract/openapi.json. Échec si la
      # copie a changé sans régénération, ou si le fichier généré a été modifié à
      # la main. L'outil (orval) vit dans tools/contract, installé à part.
      - name: Contrat — validateurs à jour
        run: |
          npm ci --prefix tools/contract
          npm run contract:generate
          git diff --exit-code -- lib/api/menfp/contract.gen.ts

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Tests du moteur (test:unit)
        run: npm run test:unit
